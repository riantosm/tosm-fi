<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tosm Finance (TosmFi) — kelola keuanganmu dengan tenang, satu dashboard untuk semua transaksi."
    />
    <meta property="og:title" content="TosmFi — Tosm Finance" />
    <meta
      property="og:description"
      content="Tosm Finance (TosmFi) — kelola keuanganmu dengan tenang, satu dashboard untuk semua transaksi."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f4f5fb" />
    <title>Tosm Finance</title>
    <script>
      // Apply the saved (or system) theme before first paint so there is no
      // light→dark flash; use-theme.tsx keeps it in sync afterwards.
      (function () {
        try {
          var stored = localStorage.getItem("tosmfi:theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#25263a" : "#f4f5fb");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
